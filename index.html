<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis Links</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><div class="brand"><img class="brand-icon" src="icons/icon-32.png" width="22" height="22" alt=""> MIS LINKS</div><div class="container-bar"><select id="containers" aria-label="Elegir contenedor"><option value="">Elegir contenedor</option></select><button id="add-container" class="plus" title="Agregar contenedor" aria-label="Agregar contenedor">+</button><button id="more" class="icon" title="Opciones" aria-label="Opciones">⋯</button></div></header>
<main><div class="section-head"><div class="section-title"><h1 id="title">Enlaces</h1><span id="count" class="count">00</span></div><button id="add-entry" class="plus" title="Agregar enlace" aria-label="Agregar enlace">+</button></div><section id="entries" aria-label="Enlaces"></section></main>
<footer><button id="export-container"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg><span>Descargar copia</span><span class="file-type">TXT</span></button></footer>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="name-dialog"><form id="name-form"><h2 id="name-title">Nuevo contenedor</h2><label>Nombre<input id="name" required maxlength="100" autocomplete="off"></label><div class="dialog-actions"><button type="button" data-close>Cancelar</button><button class="primary">Guardar</button></div></form></dialog>
<dialog id="entry-dialog"><form id="entry-form"><h2 id="entry-title">Agregar enlace</h2><label>Nombre<input id="link-name" required autocomplete="off" maxlength="2000" placeholder="Ej.: Portal del trabajo"></label><label>Link<input id="url" type="text" inputmode="url" required autocomplete="off" spellcheck="false" maxlength="10000" placeholder="https://…"></label><label>Referencia<input id="reference" required maxlength="2000" autocomplete="off"></label><div class="dialog-actions"><button type="button" data-close>Cancelar</button><button class="primary">Guardar</button></div></form></dialog>
<dialog id="confirm-dialog"><h2 id="confirm-title">¿Eliminar enlace?</h2><p id="confirm-detail"></p><div class="dialog-actions"><button type="button" data-close>Cancelar</button><button id="confirm-delete" class="danger-fill">Eliminar</button></div></dialog>
<dialog id="options-dialog"><h2>Opciones</h2><div class="option-list"><button id="rename">Renombrar contenedor</button><button id="delete-container" class="danger">Eliminar contenedor</button><button id="export-all">Descargar todo · TXT</button><button id="import">Importar copia TXT</button><input id="file" type="file" accept=".txt,.json" hidden></div><div class="dialog-actions"><button type="button" data-close>Cerrar</button></div></dialog>
<script src="app.js"></script></body></html>
